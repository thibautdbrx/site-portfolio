# URL de la base (remplace 'ma_bdd' par le nom de ta base créée)
spring.datasource.url=jdbc:mysql://localhost:3306/db_CV?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate : crée les tables automatiquement à partir de tes entités
spring.jpa.hibernate.ddl-auto=update
# Logs SQL (Pour voir les requêtes générées par Hibernate - Utile pour debugger)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

