# Nom de l'application (utile pour les logs)
spring.application.name=API-CV

# PROFIL ACTIF : Ici, on dit à Spring de charger la config 'dev' par défaut
spring.profiles.active=dev

# Port du serveur (8080 par défaut, tu peux changer si conflit)
server.port=8080

# Gestion des erreurs (Pour ne pas fuiter la stacktrace complète en public - Sécurité !)
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false

# Configuration JWT (On définit nos propres variables ici)
# IMPORTANT : En prod, ce secret sera écrasé par une variable d'environnement
application.security.jwt.secret-key=CléSecretePourLeDevDoitFaireAuMoins256BitsPourHmacSha
application.security.jwt.expiration=86400000
# 86400000 ms = 24 heures

#Documentation Swagger
springdoc.swagger-ui.path=/documentation
springdoc.swagger-ui.operations-sorter=method

spring.security.user.name=admin
spring.security.user.password=admin


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.upload.dir=uploads