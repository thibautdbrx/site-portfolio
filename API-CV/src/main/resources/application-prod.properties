# Base de données PostgreSQL (Docker ou Serveur distant)
# On injecte les valeurs via les variables système de l'OS ou du conteneur
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# "validate" : Vérifie juste que la structure de la BDD correspond au code.
# Ne modifie JAMAIS la structure en prod automatiquement (trop risqué).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Sécurité JWT en Prod
application.security.jwt.secret-key=${JWT_SECRET_KEY}

# Désactiver les logs SQL en prod (Performance + Sécurité)
spring.jpa.show-sql=false